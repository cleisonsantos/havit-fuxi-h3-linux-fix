# Havit Fuxi-H3 (USB 040b:0897) — force soft-mixer, lock hardware at 100%.
# The dongle mutes one channel below 100% and exposes a useless 0.00–0.39 dB range.
# Compatible with WirePlumber 0.4 and 0.5.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x040b"
        device.product.id = "0x0897"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer       = true
        api.alsa.ignore-dB        = true
        api.alsa.enable-hw-volume = false
        api.alsa.headroom         = 0
      }
    }
  }
]
